<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Doc</title>
<link rel="stylesheet" href="./todolist.css">

<body>
    <div class="app">
        <div class="form">
            <input type="text" placeholder="Add todo" id="todo_input">
            <button id="todo_btn">Add</button>
        </div>
    </div>
    <div id="todo_list">
        <div class="item">
            <p>Cooking my favorite dish</p>
            <div class="btns">
                <button class="edit">edit</button>
                <button class="delete">delete</button>
            </div>
        </div>
    </div>

    <script src="./todolist.js"></script>
</body>

</html>
